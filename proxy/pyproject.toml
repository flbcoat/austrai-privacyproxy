[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "austrai"
version = "3.2.0"
description = "AUSTR.AI — Lokaler KI-Assistent mit eingebautem Datenschutz. Chat, Anonymisierung, Bildschwärzung."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "uvicorn[standard]>=0.34",
    "starlette>=0.41",
    "click>=8.1",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0",
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
    "pydantic>=2.0",
    "numpy>=1.24",
    "cryptography>=43.0",
    "gliner>=0.2",
    # Dokument-Verarbeitung (PDF, DOCX, XLSX, Bilder) — Standard, kein Extra
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "pytesseract>=0.3",
    # Audio-Transkription — Standard, kein Extra
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
memory = ["chromadb>=0.5", "sentence-transformers>=3.0"]
llm = ["llama-cpp-python>=0.3"]
# Auto-Router Stage 2 (embedding-based intent classifier). Without this,
# the router falls back to keyword rules (Stage 3). Local LLM (Stage 1)
# works whenever Ollama or LMStudio is reachable, no extra dependency.
routing = ["sentence-transformers>=3.0"]
all = ["austrai[memory,llm,routing]"]

[project.scripts]
aai = "austrai_proxy.cli:main"

[tool.setuptools.packages.find]
include = ["austrai_proxy*"]

[tool.setuptools.package-data]
austrai_proxy = [
    "chat/index.html",
    "chat/favicon.svg",
    "chat/css/*.css",
    "chat/js/*.js",
    "chat/js/vendor/*.js",
    "chat/js/vendor/katex/*.js",
    "chat/js/vendor/katex/*.css",
    "chat/js/vendor/katex/fonts/*.woff2",
]
