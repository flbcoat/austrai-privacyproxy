<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUSTR.AI — Privacy-First AI</title>
  <meta name="description" content="KI-Assistent mit eingebautem Datenschutz. Chat, Anonymisierung, Bildschwärzung.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <!-- KaTeX for math/LaTeX rendering. Vendored locally (no CDN) — fonts/ dir
       sits next to the CSS file so KaTeX's relative font URLs resolve. -->
  <link rel="stylesheet" href="js/vendor/katex/katex.min.css">
  <!-- Load KaTeX synchronously (no `defer`) so window.renderMathInElement is
       available the moment the first message bubble mounts. Costs ~280KB on
       initial page load but eliminates a defer-race where the first answer
       renders before KaTeX is ready. Both scripts are vendored locally. -->
  <script src="js/vendor/katex/katex.min.js"></script>
  <script src="js/vendor/katex/auto-render.min.js"></script>
</head>
<body>

  <div id="app" class="aai-app">

    <!-- ===== Sidebar ===== -->
    <aside id="sidebar" class="aai-sidebar">
      <div class="aai-sidebar-header">
        <div class="aai-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>AUSTR.AI</span>
        </div>

        <!-- Mode Switcher -->
        <div class="aai-sidebar-nav" id="sidebar-nav">
          <button class="aai-sidebar-nav-btn active" data-mode="chat" aria-label="Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            Chat
          </button>
          <button class="aai-sidebar-nav-btn" data-mode="tools" aria-label="Werkzeuge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Werkzeuge
          </button>
        </div>

        <button id="btn-new-chat" class="aai-btn aai-btn--primary aai-btn--sm" style="width:100%">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Neuer Chat</span>
        </button>
      </div>

      <nav id="conversation-list" class="aai-conv-list" aria-label="Conversations"></nav>

      <div class="aai-sidebar-footer">
        <button id="btn-settings" class="aai-btn aai-btn--ghost" style="width:100%;justify-content:flex-start">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>Einstellungen</span>
        </button>
      </div>
    </aside>

    <!-- ===== Main Content ===== -->
    <main id="main" class="aai-main">

      <!-- Header -->
      <header id="header" class="aai-header">
        <button id="btn-sidebar-toggle" class="aai-btn aai-btn--ghost aai-btn--icon" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="aai-provider-selector" id="provider-selector">
          <select id="sel-provider" class="aai-select" aria-label="Provider"></select>
          <select id="sel-model" class="aai-select" aria-label="Model"></select>
        </div>
        <div id="aai-skill-project-mount" class="aai-skill-project-bar"></div>
        <div class="aai-header-actions">
          <button id="btn-privacy-panel" class="aai-btn aai-btn--ghost aai-btn--icon aai-privacy-toggle" aria-label="Privacy info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span id="privacy-counter" class="aai-badge-count">0</span>
          </button>
        </div>
      </header>

      <!-- Welcome View -->
      <div id="welcome-view" class="aai-view"></div>

      <!-- Chat View -->
      <div id="chat-view" class="aai-view" hidden>
        <div id="messages" class="aai-messages" role="log" aria-label="Chat messages"></div>
      </div>

      <!-- Tool View (Anonymization Pipeline) -->
      <div id="tool-view" class="aai-view" hidden></div>

      <!-- Settings Page -->
      <div id="settings-view" class="aai-view" hidden></div>

      <!-- Tutorial Page -->
      <div id="tutorial-view" class="aai-view" hidden></div>

      <!-- Input Area (Chat mode only) -->
      <div id="input-area" class="aai-input-area">
        <div id="attachments" class="aai-attachments" hidden></div>
        <div id="anon-preview" class="aai-anon-preview" hidden></div>
        <div id="aai-kb-preview-mount"></div>
        <div class="aai-input-row">
          <button id="btn-upload" class="aai-btn aai-btn--ghost aai-btn--icon" aria-label="Datei anhängen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <div class="aai-input-wrap">
            <textarea id="msg-input" class="aai-textarea" rows="1" placeholder="Nachricht eingeben…" aria-label="Nachricht"></textarea>
          </div>
          <button id="btn-preview" class="aai-btn aai-btn--ghost aai-btn--icon" aria-label="Anonymisierung prüfen" title="Anonymisierung prüfen (Ctrl+Shift+Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button id="btn-send" class="aai-btn aai-btn--primary aai-btn--icon aai-send-btn" aria-label="Senden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>

    </main>

    <!-- File input OUTSIDE of input-area so it works even when input-area is hidden -->
    <input type="file" id="file-input" hidden multiple accept=".pdf,.docx,.xlsx,.txt,.csv,.png,.jpg,.jpeg,.mp3,.wav,.m4a">

    <!-- ===== Privacy Panel (right side) ===== -->
    <aside id="privacy-panel" class="aai-privacy-panel" hidden aria-label="Privacy Info"></aside>

  </div>

  <!-- Mobile sidebar backdrop -->
  <div id="sidebar-backdrop" class="aai-sidebar-backdrop"></div>

  <!-- Overlays (onboarding first run only) -->
  <div id="onboarding-overlay" class="aai-overlay" hidden></div>
  <div id="toast-container" class="aai-toast-container" aria-live="polite"></div>

  <script type="importmap">
  {
    "imports": {
      "preact": "./js/vendor/preact.module.js",
      "preact/hooks": "./js/vendor/preact-hooks.module.js",
      "@preact/signals-core": "./js/vendor/signals-core.module.js",
      "@preact/signals": "./js/vendor/signals.module.js",
      "htm": "./js/vendor/htm.module.js"
    }
  }
  </script>
  <script type="module" src="js/app.js?v=3.2.0"></script>
</body>
</html>
